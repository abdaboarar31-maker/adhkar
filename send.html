<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="robots" content="noindex" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>إرسال إشعار — أذكاري</title>
  <style>
    :root {
      --bg: #0c0b12;
      --card: #161422;
      --border: #2b2742;
      --text: #f4f2fa;
      --muted: #a39ec2;
      --purple: #8b5cf6;
      --purple-dark: #6d28d9;
      --gold: #f5b942;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, "Segoe UI", Tahoma, Arial, sans-serif;
      background: radial-gradient(circle at top, #1d1736 0%, var(--bg) 65%);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .box {
      width: 100%;
      max-width: 460px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 24px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.55);
    }
    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }
    h1 { margin: 0; font-size: 1.2rem; color: var(--gold); }
    .brand { font-size: 0.8rem; color: var(--muted); }
    .field { margin-bottom: 14px; }
    label { display: block; margin-bottom: 6px; font-size: 0.9rem; color: var(--muted); }
    input, textarea {
      width: 100%;
      background: #0f0d19;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 11px 13px;
      font-size: 0.95rem;
      font-family: inherit;
      outline: none;
    }
    input:focus, textarea:focus { border-color: var(--purple); }
    textarea { min-height: 100px; resize: vertical; }
    button {
      width: 100%;
      padding: 13px;
      border: 0;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--purple), var(--purple-dark));
      color: #fff;
      font-size: 1rem;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
    }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .status {
      margin-top: 14px;
      padding: 12px;
      border-radius: 10px;
      font-size: 0.9rem;
      display: none;
      background: #0f0d19;
      border: 1px solid var(--border);
    }
    .status.ok { display: block; border-color: rgba(34, 197, 94, 0.45); color: #86efac; }
    .status.err { display: block; border-color: rgba(239, 68, 68, 0.45); color: #fca5a5; }
  </style>
</head>
<body>
  <main class="box">
    <div class="top">
      <h1>إرسال إشعار — أذكاري</h1>
      <span class="brand">Abd Code</span>
    </div>
    <form id="sendForm">
      <div class="field">
        <label for="title">عنوان الإشعار</label>
        <input id="title" type="text" value="أذكاري" required />
      </div>
      <div class="field">
        <label for="body">نص الرسالة</label>
        <textarea id="body" placeholder="اكتب رسالتك هنا..." required></textarea>
      </div>
      <div class="field">
        <label for="url">رابط الفتح عند الضغط</label>
        <input id="url" type="text" value="./" />
      </div>
      <div class="field">
        <label for="secret">مفتاح الإرسال السري</label>
        <input id="secret" type="password" placeholder="المفتاح السري" autocomplete="off" required />
      </div>
      <button id="sendBtn" type="submit">إرسال الإشعار الآن</button>
    </form>
    <div id="status" class="status"></div>
  </main>

  <script>
    const WORKER_URL = "https://adhkar-push.abdcode.workers.dev/broadcast";
    const form = document.getElementById("sendForm");
    const btn = document.getElementById("sendBtn");
    const statusEl = document.getElementById("status");
    const secretInput = document.getElementById("secret");

    const savedSecret = localStorage.getItem("adhkar_broadcast_secret");
    if (savedSecret) secretInput.value = savedSecret;

    function showStatus(type, msg) {
      statusEl.className = "status " + type;
      statusEl.textContent = msg;
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const title = document.getElementById("title").value.trim();
      const body = document.getElementById("body").value.trim();
      const url = document.getElementById("url").value.trim() || "./";
      const secret = secretInput.value.trim();
      if (!body) return;

      localStorage.setItem("adhkar_broadcast_secret", secret);
      btn.disabled = true;
      btn.textContent = "جاري الإرسال...";
      showStatus("ok", "يتم إرسال الإشعار الآن...");

      try {
        const res = await fetch(WORKER_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ secret, title, body, url })
        });
        const data = await res.json();
        if (!res.ok || !data.ok) {
          showStatus("err", "فشل الإرسال: " + (data.error || res.status));
        } else {
          showStatus("ok", `تم الإرسال بنجاح! وصل لـ (${data.sent}) مشترك، فشل (${data.failed}) من أصل (${data.total}).`);
          document.getElementById("body").value = "";
        }
      } catch (err) {
        showStatus("err", "حدث خطأ في الاتصال: " + err.message);
      } finally {
        btn.disabled = false;
        btn.textContent = "إرسال الإشعار الآن";
      }
    });
  </script>
</body>
</html>
